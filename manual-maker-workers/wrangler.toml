name = "manual-processor"
main = "src/index.ts"
compatibility_date = "2024-01-01"

[triggers]
crons = ["0 2 * * *"]

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "manual-processor-files"

# Provision this bucket before deployment. Separate buckets do not guarantee
# geographic isolation; placement/jurisdiction must be verified operationally.
[[r2_buckets]]
binding = "BUCKET_SECONDARY"
bucket_name = "manual-processor-files-secondary"

[[kv_namespaces]]
binding = "PROCESSING_KV"
id = "your-kv-namespace-id-here"

[vars]
DEFAULT_LANGUAGE = "ja"
MAX_FILE_SIZE_MB = "50"
WEB_UPLOAD_MAX_MB = "100"
GEMINI_MODEL_NAME = "gemini-1.5-flash"
RATE_LIMIT_ENABLED = "true"

[durable_objects]
bindings = [{ name = "PROGRESS_DO", class_name = "ProgressEngine" }]

[[migrations]]
tag = "v1"
new_sqlite_classes = [ "ProgressEngine" ]
