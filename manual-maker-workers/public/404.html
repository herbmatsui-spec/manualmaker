<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — ページが見つかりません | Manual Maker Local</title>
<meta name="robots" content="noindex">
<!-- Served for any unmatched path, so styles are inlined: a relative href would
     resolve against the requested URL rather than / . -->
<style>
  :root { color-scheme: dark; font-family: system-ui, sans-serif; color: #e5e7eb; background: #111827; }
  * { box-sizing: border-box; }
  body { max-width: 640px; margin: auto; padding: 24px; line-height: 1.7; }
  .panel { background: #1f2937; border: 1px solid #374151; border-radius: 12px; padding: 24px; }
  .code { font-size: 3rem; margin: 0; color: #a5f3fc; }
  h1 { font-size: 1.4rem; margin: 8px 0 12px; }
  .hint { color: #cbd5e1; font-size: .9rem; }
  a { color: #67e8f9; }
  a:focus-visible { outline: 2px solid #67e8f9; outline-offset: 3px; }
  @media (max-width: 600px) { body { padding: 12px; } .panel { padding: 16px; } }
</style>
</head>
<body>
<main class="panel">
  <p class="code">404</p>
  <h1>ページが見つかりません</h1>
  <p class="hint">お探しのページは移動または削除された可能性があります。</p>
  <p><a href="/">トップへ戻る</a></p>
</main>
</body>
</html>
