name = "manual-maker"
main = "./manual_processor/functions"
compatibility_date = "2024-01-01"

[[kv_namespaces]]
binding = "FILES"
id = "placeholder"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "manual-processor-files"

[[r2_buckets]]
binding = "BUCKET_SECONDARY"
bucket_name = "manual-processor-files-secondary"

[[triggers]]
crons = ["0 2 * * *"]