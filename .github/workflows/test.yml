name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

defaults:
  run:
    working-directory: manual_processor

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run linting
        run: |
          python -m pip install flake8
          python -m flake8 src/ config/ --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run security scan (bandit)
        run: |
          python -m bandit -r src/ config/ -f json -o bandit-report.json || true
          python -m bandit -r src/ config/ -ll

      - name: Run dependency audit (pip-audit)
        run: |
          python -m pip-audit --fix || true

      - name: Run tests with coverage
        run: |
          python -m pytest tests/ -v --cov=src --cov=config --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./manual_processor/coverage.xml
          fail_ci_if_error: false
          verbose: true

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run bandit security scan
        run: python -m bandit -r src/ config/ -ll

      - name: Run pip-audit
        run: python -m pip-audit || true

  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run benchmarks
        run: python -m pytest tests/performance/ -v --benchmark-only --benchmark-disable-gc
