name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
    paths:
      - 'manual_processor/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - 'manual_processor/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - production

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.11'
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  # =============================================================================
  # LINT & TYPE CHECK
  # =============================================================================
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: manual_processor/workers/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: manual_processor/requirements-pages.txt

      - name: Install Worker dependencies
        working-directory: manual_processor/workers
        run: npm ci

      - name: Install Python dependencies
        working-directory: manual_processor
        run: |
          pip install -r requirements-pages.txt --target .python_packages

      - name: TypeScript type check
        working-directory: manual_processor/workers
        run: npm run typecheck

      - name: ESLint
        working-directory: manual_processor/workers
        run: npm run lint

      - name: Python syntax check
        working-directory: manual_processor
        run: |
          python -m py_compile functions/__init__.py
          python -m py_compile functions/api/*.py
          python -m py_compile functions/queue/*.py
          python -m py_compile functions/_middleware/*.py

  # =============================================================================
  # UNIT TESTS
  # =============================================================================
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: manual_processor/requirements-pages.txt

      - name: Install Python dependencies
        working-directory: manual_processor
        run: |
          pip install -r requirements-pages.txt --target .python_packages
          pip install pytest pytest-asyncio pytest-cov

      - name: Run Pages Functions tests
        working-directory: manual_processor
        run: |
          python test_pages_functions.py

      - name: Run existing Python tests
        working-directory: manual_processor
        run: |
          python -m pytest tests/ -v --tb=short -x --ignore=tests/test_usb_monitor.py --ignore=tests/test_google_drive_manager.py || true

  # =============================================================================
  # BUILD WORKER
  # =============================================================================
  build-worker:
    name: Build Worker
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: manual_processor/workers/package-lock.json

      - name: Install Worker dependencies
        working-directory: manual_processor/workers
        run: npm ci

      - name: Build Worker
        working-directory: manual_processor/workers
        run: npm run build:worker

      - name: Upload Worker artifact
        uses: actions/upload-artifact@v4
        with:
          name: worker-dist
          path: manual_processor/workers/dist/
          retention-days: 7

  # =============================================================================
  # DEPLOY PREVIEW
  # =============================================================================
  deploy-preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, unit-tests, build-worker]
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/develop'
    environment: preview
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Configure Wrangler
        run: |
          echo "${{ secrets.CLOUDFLARE_API_TOKEN }}" | wrangler login --api-token

      - name: Deploy Pages Functions (Preview)
        working-directory: manual_processor
        run: |
          wrangler pages deploy . --project-name=manual-processor --branch=preview --commit-dirty=true

      - name: Deploy Queue Consumer (Preview)
        working-directory: manual_processor
        run: |
          wrangler deploy --config wrangler.queue.toml --env preview

      - name: Deploy Edge Worker (Preview)
        working-directory: manual_processor/workers
        run: |
          wrangler deploy --env preview

      - name: Comment PR with Preview URLs
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const previewUrl = 'https://manual-processor-preview.pages.dev';
            const workerUrl = 'https://manual-processor-worker-preview.your-subdomain.workers.dev';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🚀 Preview Deployment Ready\n\n- **Pages Functions**: ${previewUrl}\n- **Edge Worker**: ${workerUrl}\n\n*Deployed from commit ${context.sha.slice(0, 7)}*`
            });

  # =============================================================================
  # DEPLOY PRODUCTION
  # =============================================================================
  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, unit-tests, build-worker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Configure Wrangler
        run: |
          echo "${{ secrets.CLOUDFLARE_API_TOKEN }}" | wrangler login --api-token

      - name: Deploy Pages Functions (Production)
        working-directory: manual_processor
        run: |
          wrangler pages deploy . --project-name=manual-processor --branch=main --commit-dirty=true

      - name: Deploy Queue Consumer (Production)
        working-directory: manual_processor
        run: |
          wrangler deploy --config wrangler.queue.toml --env production

      - name: Deploy Edge Worker (Production)
        working-directory: manual_processor/workers
        run: |
          wrangler deploy --env production

      - name: Notify Deployment
        uses: actions/github-script@v7
        with:
          script: |
            const prodUrl = 'https://manual-processor.pages.dev';
            const workerUrl = 'https://manual-processor.your-subdomain.workers.dev';
            github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: context.payload.deployment?.id || 0,
              state: 'success',
              environment_url: prodUrl,
              log_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: 'Production deployment successful'
            }).catch(() => {}); // Ignore if deployment not found

  # =============================================================================
  # MANUAL DEPLOY
  # =============================================================================
  manual-deploy:
    name: Manual Deploy
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    environment: ${{ github.event.inputs.environment }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Configure Wrangler
        run: |
          echo "${{ secrets.CLOUDFLARE_API_TOKEN }}" | wrangler login --api-token

      - name: Deploy Pages Functions
        working-directory: manual_processor
        run: |
          if [ "${{ github.event.inputs.environment }}" = "production" ]; then
            wrangler pages deploy . --project-name=manual-processor --branch=main
          else
            wrangler pages deploy . --project-name=manual-processor --branch=preview
          fi

      - name: Deploy Queue Consumer
        working-directory: manual_processor
        run: |
          if [ "${{ github.event.inputs.environment }}" = "production" ]; then
            wrangler deploy --config wrangler.queue.toml --env production
          else
            wrangler deploy --config wrangler.queue.toml --env preview
          fi

      - name: Deploy Edge Worker
        working-directory: manual_processor/workers
        run: |
          if [ "${{ github.event.inputs.environment }}" = "production" ]; then
            wrangler deploy --env production
          else
            wrangler deploy --env preview
          fi