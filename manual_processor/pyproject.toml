[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "manual_processor"
version = "2.2.0"
description = "手書きマニュアル自動整理システム - AI-powered OCR and document processing"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "Manual Processor Team"}
]
keywords = ["ocr", "pdf", "gemini", "handwriting", "manual-processing"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "tenacity>=8.2.0",
    "google-genai>=0.8.0",
    "google-cloud-vision>=3.7.0",
    "pypdfium2>=4.27.0",
    "pypdf>=4.0.0",
    "PyMuPDF>=1.24.0",
    "keyring>=24.0.0",
    "python-docx>=1.1.0",
    "fpdf2>=2.7.0",
    "python-dotenv>=1.0.0",
    "pillow>=10.0.0",
    "edge-tts>=6.1.0",
    "gTTS>=2.5.0",
    "pydub>=0.25.1",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "jinja2>=3.1.0",
    "aiofiles>=24.1.0",
    "websockets>=12.0",
    "pyinstaller>=6.0.0",
    "watchdog>=4.0.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-benchmark>=4.0.0",
    "bandit>=1.7.0",
    "pip-audit>=2.6.0",
]

[project.scripts]
manual-processor = "main:main"
manual-processor-gui = "src.gui.main:main"
manual-processor-web = "src.web.app:run"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "config*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
pythonpath = ["."]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src", "config"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
fail_under = 65

[tool.bandit]
exclude_dirs = ["tests", "build", "__pycache__"]
skips = ["B101"]  # Skip assert warnings in tests
